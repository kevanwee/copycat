services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      COPYCAT_DATABASE_URL: sqlite:///./data/copycat.db
      COPYCAT_STORAGE_ROOT: ./data/uploads
      COPYCAT_REPORT_ROOT: ./data/reports
      COPYCAT_CELERY_TASK_ALWAYS_EAGER: "true"
      COPYCAT_FRONTEND_BASE_URL: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - case-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  case-data:
